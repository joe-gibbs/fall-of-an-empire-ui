<!doctype html>
<html lang="en" spellcheck="false" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fall of an Empire - Web UI</title>
    <script>
      (function () {
        var nativeAddEventListener = window.addEventListener;
        var nativeRemoveEventListener = window.removeEventListener;

        window.addEventListener = function (type, listener, options) {
          if (type === 'test' && listener === options && listener && typeof listener === 'object') {
            return;
          }
          return nativeAddEventListener.call(this, type, listener, options);
        };

        window.removeEventListener = function (type, listener, options) {
          if (type === 'test' && listener === options && listener && typeof listener === 'object') {
            return;
          }
          return nativeRemoveEventListener.call(this, type, listener, options);
        };
      })();
    </script>
    <script>
      (function () {
        if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__) return;

        var nextRendererId = 1;
        var renderers = new Map();
        var roots = new Map();
        var listeners = {};

        function emit(event, payload) {
          var handlers = listeners[event];
          if (!handlers) return;
          handlers.slice().forEach(function (handler) {
            try {
              handler(payload);
            } catch (error) {
              setTimeout(function () {
                throw error;
              });
            }
          });
        }

        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          supportsFiber: true,
          isDisabled: false,
          renderers: renderers,
          inject: function (renderer) {
            var id = nextRendererId++;
            renderers.set(id, renderer);
            roots.set(id, new Set());
            emit('renderer', { id: id, renderer: renderer });
            return id;
          },
          onCommitFiberRoot: function (rendererId, root) {
            var rendererRoots = roots.get(rendererId);
            if (!rendererRoots) {
              rendererRoots = new Set();
              roots.set(rendererId, rendererRoots);
            }
            rendererRoots.add(root);
            emit('commitFiberRoot', { rendererId: rendererId, root: root });
          },
          onCommitFiberUnmount: function (rendererId, fiber) {
            emit('commitFiberUnmount', { rendererId: rendererId, fiber: fiber });
          },
          getFiberRoots: function (rendererId) {
            return roots.get(rendererId) || new Set();
          },
          sub: function (event, handler) {
            if (!listeners[event]) listeners[event] = [];
            listeners[event].push(handler);
            return function () {
              window.__REACT_DEVTOOLS_GLOBAL_HOOK__.off(event, handler);
            };
          },
          off: function (event, handler) {
            var handlers = listeners[event];
            if (!handlers) return;
            var index = handlers.indexOf(handler);
            if (index !== -1) handlers.splice(index, 1);
          },
          emit: emit,
          checkDCE: function () {},
          setStrictMode: function () {},
          registerInternalModuleStart: function () {},
          registerInternalModuleStop: function () {},
        };
      })();
    </script>
  </head>
  <body oncontextmenu="return false">
    <div id="root"></div>
    <!--
      Import map for runtime-loaded mods. Lets a mod write
        import React from 'react';
        import { registerScreen, ScreenShell } from '@foae/sdk';
      and have those specifiers resolve to the host's single React instance
      and the SDK published on globalThis.FOAE. Must appear BEFORE the main
      bundle script so it is active when mod modules are dynamically
      imported later. The main bundle itself does NOT use the import map -
      its own imports were resolved at build time.
    -->
    <script type="importmap">
    {
      "imports": {
        "react": "/sdk/react.js",
        "react/jsx-runtime": "/sdk/react-jsx-runtime.js",
        "@foae/sdk": "/sdk/foae-sdk.js"
      }
    }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
